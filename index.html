<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#020203" />
    <title>Fray — Rip Real Fabric</title>
    <meta
      name="description"
      content="Rip real fabric in your browser. Tartan, satin, linen and burlap woven thread by thread and simulated on your GPU: pull it, slash it, hear it tear, share the damage."
    />
    <meta name="robots" content="index, follow" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Fray" />
    <meta property="og:title" content="Fray — Rip Real Fabric" />
    <meta
      property="og:description"
      content="Woven thread by thread and simulated on your GPU. Pull it, slash it, hear it tear, share the damage."
    />
    <meta property="og:image" content="/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:alt" content="Fray: torn fabric, thread by thread" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Fray — Rip Real Fabric" />
    <meta
      name="twitter:description"
      content="Woven thread by thread and simulated on your GPU. Pull it, slash it, hear it tear, share the damage."
    />
    <meta name="twitter:image" content="/og.png" />
    <meta name="twitter:image:alt" content="Fray: torn fabric, thread by thread" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@500;600&display=swap"
    />
    <link rel="stylesheet" href="/src/style.css" />
    <script type="module" src="/src/main.js"></script>
  </head>
  <body class="loading">
    <div class="loader" role="progressbar" aria-label="Loading" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <span class="loader-rows loader-track"></span>
      <span class="loader-rows loader-fill"></span>
      <span class="loader-needle"></span>
    </div>
    <div class="dock">
      <ul class="experiences" id="experiences" role="menu" aria-label="Experiences" hidden>
        <li role="none">
          <button class="experience" type="button" role="menuitem" data-experience="beneath">Smilie</button>
        </li>
        <li role="none" class="experiences-rule" aria-hidden="true"></li>
        <li role="none">
          <button
            class="experience fabric"
            type="button"
            role="menuitemradio"
            aria-checked="false"
            data-fabric="burlap"
          >
            Burlap
          </button>
        </li>
        <li role="none">
          <button class="experience fabric" type="button" role="menuitemradio" aria-checked="false" data-fabric="linen">
            Linen
          </button>
        </li>
        <li role="none">
          <button class="experience fabric" type="button" role="menuitemradio" aria-checked="false" data-fabric="satin">
            Satin
          </button>
        </li>
        <li role="none">
          <button class="experience fabric" type="button" role="menuitemradio" aria-checked="true" data-fabric="tartan">
            Tartan
          </button>
        </li>
      </ul>
      <button
        class="menu"
        type="button"
        aria-label="Experiences"
        title="Experiences"
        aria-haspopup="menu"
        aria-expanded="false"
        aria-controls="experiences"
      >
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <path d="M2.8 12s3.4-6 9.2-6 9.2 6 9.2 6-3.4 6-9.2 6-9.2-6-9.2-6z" />
          <circle cx="12" cy="12" r="2.6" />
        </svg>
      </button>
      <button class="record" type="button" aria-label="Record a clip" title="Record a clip (V)" aria-pressed="false">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <circle class="record-dot" cx="12" cy="12" r="5.5" />
          <circle cx="12" cy="12" r="9" />
        </svg>
        <span></span>
      </button>
      <button class="share" type="button" aria-label="Share" title="Share your damage">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <path d="M12 3.5v12" />
          <path d="m7.8 7.7 4.2-4.2 4.2 4.2" />
          <path d="M5 13.5v6h14v-6" />
        </svg>
        <span>Share</span>
      </button>
      <button
        class="tool"
        type="button"
        aria-label="Knife"
        title="Knife: drag across the fabric to cut it"
        aria-pressed="false"
      >
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <path d="M3 17.2 13.9 6.3l3.1 3.1-6.1 6.1c-1.6 1.6-3.8 2.5-6.1 2.5H3z" />
          <path d="m13.9 6.3 3.4-3.4 3.1 3.1-3.4 3.4" />
        </svg>
        <span>Knife</span>
      </button>
      <button class="reset" type="button" aria-label="Reset the fabric" title="Reset the fabric">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <path d="M19.4 13.1a7.5 7.5 0 1 1-2.1-6.4" />
          <path d="M18.3 3.4v3.9h-3.9" />
        </svg>
        <span>Reset</span>
      </button>
    </div>
    <div class="score" aria-hidden="true">
      <span class="score-n">0</span>
      <span class="score-l">threads shredded</span>
      <span class="score-t">0:00</span>
    </div>
    <div class="sheet" role="dialog" aria-modal="true" aria-label="Share your damage" hidden>
      <div class="sheet-card">
        <img class="sheet-img" alt="Your shredded fabric" />
        <video class="sheet-video" controls playsinline loop muted hidden></video>
        <p class="sheet-text"></p>
        <div class="sheet-actions">
          <a class="sheet-x" href="#" target="_blank" rel="noopener">Post on X</a>
          <button class="sheet-share" type="button" hidden>Share…</button>
          <a class="sheet-save" href="#" download="fray.png">Save image</a>
        </div>
        <p class="sheet-hint" hidden>
          Posting from the web can't attach the clip for you: save it, then add it to your post.
        </p>
        <div class="sheet-actions sheet-actions-end">
          <button class="sheet-close" type="button">Close</button>
        </div>
      </div>
    </div>
    <div class="status" role="status" aria-live="polite"></div>
  </body>
</html>
